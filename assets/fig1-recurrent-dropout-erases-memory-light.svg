<text x="60" y="334" font-size="14" fill="#b02f2f" text-anchor="start" font-weight="400">100단어짜리 문장이면 이 가위질이 100번 반복된다 — 첫 단어가 끝까지 살아남을 확률은 0.8<tspan dy="-6" font-size="10">100</tspan><tspan dy="6">&#8203;</tspan> &#8776; 2&#215;10<tspan dy="-6" font-size="10">&#8722;10</tspan><tspan dy="6">&#8203;</tspan>, 사실상 0.</text>
<text x="60" y="354" font-size="13" fill="#b02f2f" text-anchor="start" font-weight="400">LSTM이 셀 스테이트까지 따로 만들어 지키려 했던 장기 기억을, 드롭아웃이 앞장서서 부수는 셈.</text>
<text x="880" y="376" font-size="11" fill="#898781" text-anchor="end" font-weight="400">Zaremba, Sutskever &amp; Vinyals (2015) · Recurrent Neural Network Regularization</text>
